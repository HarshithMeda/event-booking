spring.application.name=event-booking

# Where the database is
spring.datasource.url=jdbc:postgresql://localhost:5432/eventbooking
spring.datasource.username=eventbooking_user

# The password lives in a private file that never goes to GitHub
spring.config.import=optional:file:./local.properties

# Flyway will create the tables in Part B, so Hibernate must not
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Bookings: how long a hold lasts, and how often expired holds are released
app.booking.hold-duration=PT10M
app.booking.expiry-check-interval=PT30S
# Run UPDATEs in id order, so overlapping bookings can't deadlock
spring.jpa.properties.hibernate.order_updates=true
# Redis cache (localhost:6379 by default). Short timeouts so a Redis outage doesn't slow requests down.
spring.cache.type=redis
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
app.cache.event-ttl=PT10M
app.cache.seat-map-ttl=PT30S
