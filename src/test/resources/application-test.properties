# Test-only settings (profile "test"). Never used in production.
# Dummy secret so tests never need local.properties. At least 32 bytes for HS256.
app.jwt.secret=test-only-dummy-jwt-secret-do-not-use-in-production
# Tests call the expiry job directly, so the 30-second scheduler is turned off.
app.scheduling.enabled=false
# Production uses a pool of 5 (small hosted databases). The concurrency test needs 20 transactions
# running at the same moment, so tests get a bigger pool, with every connection open from the start.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
