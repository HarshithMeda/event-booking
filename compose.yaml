# Run everything:  docker compose up --build
# Secrets come from .env (git-ignored). Copy .env.example to .env and fill it in.
name: event-booking

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventbooking
      POSTGRES_USER: eventbooking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbooking_user -d eventbooking"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No published port: only the app can reach the database.

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Cache only, so no volume: losing it just means a few cache misses.

  app:
    build: .
    image: event-booking:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventbooking
      SPRING_DATASOURCE_USERNAME: eventbooking_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "${APP_PORT:-8080}:8080"
    mem_limit: 768m
    restart: unless-stopped

volumes:
  pgdata:
